apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgscope-collector
  labels:
    app: pgscope-collector

spec:
  replicas: {{ .Values.collector.replicas }}

  selector:
    matchLabels:
      app: pgscope-collector

  template:
    metadata:
      labels:
        app: pgscope-collector

    spec:
      serviceAccountName: pgscope-collector

      containers:
        - name: collector
          image: "{{ .Values.collector.image.repository }}:{{ .Values.collector.image.tag }}"
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}

          env:
            - name: PGSCOPE_CONFIG
              value: /etc/pgscope/pgscope.yaml

            - name: PGSCOPE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: PGSCOPE_STORE_HOST
              value: {{ .Values.storage.host | quote }}

            - name: PGSCOPE_STORE_PORT
              value: {{ .Values.storage.port | quote }}

            - name: PGSCOPE_STORE_DB
              value: {{ .Values.storage.database | quote }}

            - name: PGSCOPE_STORE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collector.storageSecret.name }}
                  key: {{ .Values.collector.storageSecret.usernameKey }}

            - name: PGSCOPE_STORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.collector.storageSecret.name }}
                  key: {{ .Values.collector.storageSecret.passwordKey }}

          volumeMounts:
            - name: config
              mountPath: /etc/pgscope
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: pgscope-config
