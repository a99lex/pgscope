apiVersion: v1
kind: ServiceAccount
metadata:
  name: pgscope-collector

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pgscope-collector-secret-reader

rules:
  - apiGroups: [""]
    resources: ["secrets"]

    resourceNames:
{{- range .Values.monitoredDatabaseSecrets }}
      - {{ . | quote }}
{{- end }}

    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pgscope-collector-secret-reader

subjects:
  - kind: ServiceAccount
    name: pgscope-collector

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pgscope-collector-secret-reader
