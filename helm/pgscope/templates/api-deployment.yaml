apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgscope-api
  labels:
    app: pgscope-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: pgscope-api
  template:
    metadata:
      labels:
        app: pgscope-api
    spec:
      serviceAccountName: pgscope-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: PGSCOPE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace


            - name: PGSCOPE_DB_HOST
              value: {{ .Values.storage.host | quote }}
            - name: PGSCOPE_DB_PORT
              value: {{ .Values.storage.port | quote }}
            - name: PGSCOPE_DB_NAME
              value: {{ .Values.storage.database | quote }}
            - name: PGSCOPE_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.databaseSecret.existingSecret is required" .Values.api.databaseSecret.existingSecret }}
                  key: {{ .Values.api.databaseSecret.usernameKey }}
            - name: PGSCOPE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.databaseSecret.existingSecret is required" .Values.api.databaseSecret.existingSecret }}
                  key: {{ .Values.api.databaseSecret.passwordKey }}
      volumes:
        - name: tmp
          emptyDir: {}
