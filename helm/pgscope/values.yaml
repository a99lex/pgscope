api:
  image:
    repository: pgscope-api
    tag: "1.6.0"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  service:
    type: ClusterIP
    port: 8000

  databaseSecret:
    existingSecret: pgscope-api-db
    usernameKey: username
    passwordKey: password

collector:
  image:
    repository: pgscope-collector
    tag: "1.1.1"
    pullPolicy: IfNotPresent

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  storageSecret:
    existingSecret: pgscope-db
    usernameKey: store-user
    passwordKey: store-password

  intervalSeconds: 30
  queryLimit: 200

retention:
  snapshotsDays: 7
  deltasDays: 30
  findingsDays: 90
  cleanupIntervalMinutes: 60

storage:
  host: pg-lab-rw
  port: 5432
  database: pgscope

monitoredDatabaseSecrets:
  - pgscope-db

auth:
  sessionHours: 12
  cookieSecure: false

migration:
  databaseSecret:
    existingSecret: pgscope-migration-db
    usernameKey: username
    passwordKey: password
