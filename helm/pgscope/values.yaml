api:
  image:
    repository: pgscope-api
    tag: "1.6.0"
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    type: ClusterIP
    port: 8000

  databaseSecret:
    existingSecret: ""
    name: pgscope-api-db
    usernameKey: username
    passwordKey: password
    username: pgscope_api
    password: "PgScopeWriter123!"

collector:
  image:
    repository: pgscope-collector
    tag: "1.6.0"
    pullPolicy: IfNotPresent

  replicas: 1

  storageSecret:
    existingSecret: ""
    name: pgscope-db
    usernameKey: store-user
    passwordKey: store-password
    username: pgscope_writer
    password: "PgScopeWriter123!"

  intervalSeconds: 30
  queryLimit: 200

retention:
  snapshotsDays: 7
  deltasDays: 30
  findingsDays: 90
  cleanupIntervalMinutes: 60

storage:
  host: pg-lab2-rw
  port: 5432
  database: pgscope

monitoredDatabaseSecrets:
  - pgscope-db

auth:
  sessionHours: 12
  cookieSecure: false

migration:
  databaseSecret:
    existingSecret: pgscope-migration-db
    usernameKey: username
    passwordKey: password
