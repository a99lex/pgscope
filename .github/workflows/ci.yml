name: PgScope CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m py_compile api/main.py
          python -m py_compile collector/collector.py

      - name: Install test dependencies
        run: |
          python -m pip install -r api/requirements.txt pytest httpx

      - name: Run unit tests
        env:
          PYTHONPATH: api:oracle
        run: pytest -q tests oracle/test_oracle_collector.py

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: |
          helm lint helm/pgscope

      - name: Render Helm chart
        run: |
          helm template pgscope helm/pgscope > /tmp/pgscope-rendered.yaml

      - name: Validate rendered manifests
        run: |
          test -s /tmp/pgscope-rendered.yaml
          grep -q "kind: Deployment" /tmp/pgscope-rendered.yaml
          grep -q "kind: Job" /tmp/pgscope-rendered.yaml
          grep -q "pgscope-api" /tmp/pgscope-rendered.yaml
          grep -q "pgscope-collector" /tmp/pgscope-rendered.yaml
          grep -q "/health/live" /tmp/pgscope-rendered.yaml
          grep -q "/health/ready" /tmp/pgscope-rendered.yaml
          if grep -q "kind: Secret" /tmp/pgscope-rendered.yaml; then
            echo "Helm chart must not generate database Secrets"
            exit 1
          fi
          if grep -q "PgScopeWriter123" /tmp/pgscope-rendered.yaml; then
            echo "Rendered chart contains an insecure default password"
            exit 1
          fi

      - name: Check migrations
        run: |
          test -f migrations/001_schema.sql
          test -f migrations/002_auth_first_login.sql
          test -f migrations/003_storage_grants.sql
          test -f migrations/004_api_grants.sql
          test -f migrations/005_plan_regression.sql
          test -f migrations/008_oracle_system_metrics.sql
